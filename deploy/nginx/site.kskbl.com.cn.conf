# 面试站(Next.js SSG 静态导出)nginx 样例
#
# 这是【手动安装】的配置样例 —— 与 hls-api 一样走宝塔 extension hook:
#   1. 域名(tiku.kskbl.com.cn,可在 DNS 服务商处加 A/CNAME 记录;走 CF 则开橙云)
#   2. 宝塔面板为该域名建站并签证书(Let's Encrypt / CF 源站证书)
#   3. 把本文件内容放到 /www/server/panel/vhost/nginx/extension/kskbl.com.cn/hls-site.conf
#      (按实际域名改 server_name 与证书路径)
#   4. nginx -t && nginx -s reload
#
# 站点是纯静态(Next export 产物 /opt/hls-site/current),nginx 只做静态服务:
# 无 Node 进程,服务器零内存开销。动态数据(浏览计数等)由浏览器直连 API 域。

# HTTP -> HTTPS
server {
    listen 80;
    server_name tiku.kskbl.com.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tiku.kskbl.com.cn;

    # 证书路径按宝塔实际签发的填
    # ssl_certificate     /www/server/panel/vhost/cert/tiku.kskbl.com.cn/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/tiku.kskbl.com.cn/privkey.pem;

    root /opt/hls-site/current;
    index index.html;

    # Next 静态导出的路由兜底:/question/xxx -> question/xxx.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 带指纹的静态资源:永久缓存(文件名变 = 内容变)
    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # HTML 不缓存(发版即生效);sitemap/rss/llms 短缓存
    location ~* \.(html|xml|txt)$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/xml image/svg+xml;
    gzip_min_length 1k;
}
