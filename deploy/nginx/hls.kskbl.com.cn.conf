# hlsEdu 前端 SPA 站点(hls.kskbl.com.cn)
#
# 安装位置:
#   /www/server/panel/vhost/nginx/hls.kskbl.com.cn.conf
# 改完:nginx -t && nginx -s reload
#
# 与后端的关系:后端 compose 项目在 /opt/hls-api(app 容器发布在宿主 4000),
# 本 vhost 的 /api-hls/ 与 kskbl.com.cn/api-hls 指向同一个容器,互不冲突。
# 静态产物由 CI(.github/workflows/web.yml)部署到 /opt/hls-web/releases/<sha>,
# 再把 /opt/hls-web/current 软链切过去(原子发布)。
#
# ⚠️ /opt/hls-web/current 必须是符号链接,不能是普通目录 ——
#    CI 的 `mv -Tf current.tmp current` 无法用一个软链替换非空目录。

server {
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name hls.kskbl.com.cn;

    # SPA 静态根。CI 通过 current 软链做原子切换
    root /opt/hls-web/current;
    index index.html;

    # 复用通配的 Cloudflare Origin 证书(*.kskbl.com.cn,有效期到 2041)
    # 不要申请新证书;CF 侧 SSL 模式保持 完全(严格)
    ssl_certificate     /www/server/panel/vhost/cert/cloudflare/origin.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497  https://$host$request_uri;

    # ---- SPA:静态文件优先,未命中一律回 index.html,交给客户端路由 ----
    # 忘了这行的话,直接访问 /todos 这类深链接会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存,否则发版后用户还拿旧壳
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 带 hash 的静态资源长缓存(Vite 输出到 /assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- 后端 API:与 kskbl.com.cn/api-hls 同一个容器(宿主 4000)----
    # proxy_pass 末尾的 / 会剥掉 /api-hls 前缀;后端路由本来就是根路径
    location /api-hls/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /api-hls {
        return 301 /api-hls/;
    }

    # ---- 旧上传文件(只剩头像)。alias 末尾斜杠必须和 location 一致 ----
    # 数据库里 users.avatarPath 形如 /uploads/avatars/xxx.jpg
    location /uploads/ {
        alias /opt/hls-web/uploads/;
        expires 7d;
        access_log off;
    }

    access_log /www/wwwlogs/hls.kskbl.com.cn.log;
    error_log  /www/wwwlogs/hls.kskbl.com.cn.error.log;
}
