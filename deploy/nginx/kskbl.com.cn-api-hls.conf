# hlsEdu 新后端(Hono + PG)对外入口。
#
# 安装位置(宝塔的 extension 钩子,不改 html_kskbl.com.cn.conf 本体):
#   /www/server/panel/vhost/nginx/extension/kskbl.com.cn/hls-api.conf
# 改完执行:nginx -t && nginx -s reload
#
# 容器由 /opt/hls-api 的 CI 部署,发布在宿主机 4000(见 /opt/hls-api/.env 的 PORT)。
# 走 /api-hls 子路径,与老应用的 /api(→ tasks-api 9999)并存互不影响。

# proxy_pass 末尾必须带 / —— 会剥掉 /api-hls 前缀,而后端路由本来就是根路径
# (前端 axios baseURL: '/api' 的历史契约,见 README「路径与鉴权」)。
location /api-hls/ {
    proxy_pass http://127.0.0.1:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host:$server_port;
    proxy_read_timeout 60s;
}

# 不带尾斜杠时补上,避免 proxy_pass 拼出错误路径
location = /api-hls {
    return 301 /api-hls/;
}
