# hlsEdu 反爬/限流的 http 级定义(文件名 0. 前缀保证先于 vhost 加载)
# - hls_public_api:公开读接口的限流 zone(plan §4.3:burst ~20,超了 429)
# - hls_bad_bot:UA 黑名单(空 UA / 脚手架默认 UA 直接 403);本机 127.0.0.1/::1 永远放行,
#   服务器侧的健康检查与运维 curl 不受影响

limit_req_zone $binary_remote_addr zone=hls_public_api:10m rate=10r/s;

geo $hls_local {
    default 0;
    127.0.0.1 1;
    ::1 1;
}

map "$hls_local|$http_user_agent" $hls_bad_bot {
    # 本机请求一律放行
    ~^1 0;
    # 空 UA 拦截
    ~\|$ 1;
    # 常见脚本/爬虫脚手架默认 UA
    ~(?i)(python|httpclient|go-http|scrapy|okhttp|java/) 1;
    default 0;
}
