name: Web CI

on:
  push:
    branches: [hls-api]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    name: build · deploy static
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DEPLOY_DIR: /opt/hls-web

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload dist to server
        # 传到 releases/<sha>/,此时还没切 current,线上不受影响
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'web/dist/*'
          target: '${{ env.DEPLOY_DIR }}/releases/${{ github.sha }}'
          strip_components: 2
          overwrite: true

      - name: Atomic switch + cleanup
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # 必须显式声明:script 是原样发到远端执行的,不声明的话远端读不到
          envs: DEPLOY_DIR,SHA
          script: |
            set -e
            cd "$DEPLOY_DIR"
            # nginx 以 www 用户跑,必须有读权限
            chmod -R a+rX "releases/$SHA"
            # 原子切换:先建临时链接再 mv -Tf,避免出现半个链接
            ln -sfn "releases/$SHA" current.tmp
            mv -Tf current.tmp current
            echo "=== current -> $(readlink current) ==="
            # 只保留最近 5 份
            ls -1dt releases/*/ | tail -n +6 | xargs -r rm -rf
            ls -1dt releases/*/ | head -6
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          SHA: ${{ github.sha }}
