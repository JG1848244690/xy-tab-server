name: CI

# 前端 SPA 搬进本仓库的 web/ 之后,只改前端/文档/服务器侧 nginx 片段不该触发后端
# 重建镜像 + 重启容器。paths-ignore 的语义是「本次 diff 全落在这些路径里才跳过」,
# 前后端混改时照常触发。
# 注意:scripts/** 不能加进来 —— 迁移脚本在 CI 里要跑 tsc(tsconfig.scripts.json)。
# 注意:这是 hls-api 分支自己的 ci.yml;pgsql 分支有它自己的副本,完全不受影响。
on:
  push:
    branches: ['**']
    paths-ignore:
      - 'apps/web/**'
      - 'docs/**'
      - 'deploy/**'
      - '**.md'
  pull_request:
    branches: [master, main, hls-api]
    paths-ignore:
      - 'apps/web/**'
      - 'docs/**'
      - 'deploy/**'
      - '**.md'

jobs:
  ci:
    name: install · typecheck · test · build · docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 给 env.ts 的 zod 校验喂 dummy 值。
    # 单元测试(auth.test.ts)用 vi.mock 把 db 替换;
    # 集成测试(*.integration.test.ts)连下面的 postgres service 容器,
    # TEST_DATABASE_URL 指向它,跑真实 SQL(可见性/事务/唯一索引)。
    # JWT_SECRET 用 dummy,只要过 min(16) 校验即可(ci 不发真实登录请求)。
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
      DATABASE_SSL: 'false'
      LOG_LEVEL: info
      NODE_ENV: test
      JWT_SECRET: dummy-jwt-secret-for-ci-only-32chars
    permissions:
      # GHCR push 需要 packages: write
      contents: read
      packages: write

    # 集成测试的真实 PG。端口映射到 localhost:5432,
    # 与 TEST_DATABASE_URL 对齐; unhealthy 会自动取消整个 job
    services:
      postgres:
        # pgvector 版:迁移里有 CREATE EXTENSION vector + embedding 列
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # 不写 version,从根 package.json 的 packageManager 读(全仓锁定 10.23.0)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/api
        run: pnpm exec tsc --noEmit

      - name: Typecheck scripts
        # 数据迁移脚本不进 dist(根 tsconfig 只含 src),但它要动真实用户数据,
        # 类型错误必须查出来 —— tsx 运行时不查类型
        working-directory: apps/api
        run: pnpm exec tsc -p tsconfig.scripts.json --noEmit

      - name: Test
        working-directory: apps/api
        run: pnpm test --run

      - name: Build
        working-directory: apps/api
        run: pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # GITHUB_TOKEN 默认能 push 到当前仓库所属用户的 package
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build & push to GHCR
        uses: docker/build-push-action@v6
        with:
          # monorepo 后 context 仍是仓库根(锁文件/config 在根),
          # dockerfile 指向 apps/api;其专属 ignore 是 apps/api/Dockerfile.dockerignore
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/jg1848244690/hls-api:latest
            ghcr.io/jg1848244690/hls-api:${{ github.sha }}
          # GitHub Actions 自带层缓存,跨 workflow 复用
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # ⚠️ build 阶段绝不走缓存:2026-10-20 事故——gha 缓存把 10-18 的
          # 编译产物原样还原(新代码没编译进镜像),Turnstile/配额全部静默丢失。
          # deps 层照旧缓存,只多花编译的 1-2 分钟
          no-cache-filters: |
            build

      - name: Make package public
        # GHCR 默认 private,设成 public 方便服务器无 token 直接 pull(测试项目用)。
        # 只在 push 时设,PR 跑没意义。
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH /user/packages/container/hls-api -f visibility=public || true

  deploy:
    name: deploy to server
    needs: ci
    runs-on: ubuntu-latest
    # 只在 push hls-api 时部署。
    # CI 对所有分支都建镜像(方便随时拉),但自动部署只认 hls-api ——
    # 其它分支的 :latest 会漂移,若也部署就会把测试分支推上生产。
    if: github.event_name == 'push' && github.ref == 'refs/heads/hls-api'
    timeout-minutes: 5

    env:
      # hlsEdu 独立部署,与旧 tasks 服务(/opt/tasks-api)并存
      DEPLOY_DIR: /opt/hls-api
      BRANCH: hls-api
      # 服务器上这个仓库的 remote 名。旧 deploy 脚本用的是 github(不是 git clone 的
      # 默认值 origin),已核实服务器上 /opt/tasks-api 就是 github → git@github.com:JG1848244690/xy-tab-server.git。
      # /opt/hls-api 首次 clone 时也用 -o github,保持一致。
      DEPLOY_REMOTE: github

    steps:
      - name: Deploy via SSH
        # appleboy/ssh-action:Secrets 加密存服务器私钥,runner 上解密用完即丢
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # 必须显式声明。script 的内容是被原样送到远端执行的,
          # job 级 env: 只存在于 runner 进程上,远端 shell 看不到 ——
          # 不加这行的话 $DEPLOY_DIR 在服务器上是空的,
          # cd $DEPLOY_DIR 会退化成 cd(回 home),然后在 home 里找 .env。
          envs: DEPLOY_DIR,BRANCH,DEPLOY_REMOTE
          script: |
            set -e

            # 首次部署时这个目录还不存在(hlsEdu 是新服务,与旧的 /opt/tasks-api 并存)。
            # 单独检查一下,不然 set -e 会让 cd 失败,报错只有一句干巴巴的
            # "Process exited with status 1",看不出是目录不存在。
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "::error::$DEPLOY_DIR 不存在。首次部署需先在服务器上建目录并 clone:"
              echo "::error::  sudo mkdir -p $DEPLOY_DIR && sudo chown \$USER $DEPLOY_DIR"
              echo "::error::  git clone <repo> $DEPLOY_DIR"
              echo "::error::  cd $DEPLOY_DIR && cp .env.example .env && vi .env"
              exit 1
            fi
            cd "$DEPLOY_DIR"

            # .env 存 JWT_SECRET 等,不进 git。缺了 compose 会因
            # ${JWT_SECRET:?...} 直接失败,所以先明确检查并给出可操作的提示,
            # 避免部署到一半报一个看不懂的 compose 插值错误。
            if [ ! -f .env ]; then
              echo "::error::$DEPLOY_DIR/.env 不存在。首次部署需手动创建:"
              echo "::error::  cd $DEPLOY_DIR && cp .env.example .env && vi .env"
              echo "::error::  至少要设 JWT_SECRET(至少 16 字符),生成: openssl rand -base64 32"
              exit 1
            fi

            # fetch 到 remote-tracking 分支(避免 git 拒绝 fetch 到当前已 checkout 的分支)
            git fetch "$DEPLOY_REMOTE" "$BRANCH:refs/remotes/$DEPLOY_REMOTE/$BRANCH" --force
            git reset --hard "$DEPLOY_REMOTE/$BRANCH"

            # 用 commit SHA 作为镜像 tag(:sha 不可变,:latest 会漂移且不可回滚)
            # 必须用完整 40 位 SHA —— CI 里 build-push-action 打的 tag 是 ${{ github.sha }},
            # 用 --short 得到的 7 位和它对不上,docker compose pull 会找不到镜像。
            export IMAGE_TAG=$(git rev-parse HEAD)
            echo "=== 部署 $IMAGE_TAG ==="

            # 拉新镜像 + 重启容器
            # --remove-orphans 会清掉 compose 文件里已删除的服务(比如旧的 tasks 服务),
            # 只影响当前 compose 项目内的孤儿容器,不会碰别的项目
            docker compose pull
            docker compose up -d --remove-orphans

            # 健康检查:app 容器有 healthcheck,但 compose up 返回时可能还没到 healthy,
            # 这里显式等一下再判定,免得"部署成功"其实容器起不来
            echo "=== 等待健康检查 ==="
            for i in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q app) 2>/dev/null || echo "none")
              if [ "$status" = "healthy" ]; then
                echo "=== deployed ${IMAGE_TAG} (healthy) ==="
                docker compose ps
                exit 0
              fi
              if [ "$status" = "unhealthy" ]; then
                echo "=== deployed ${IMAGE_TAG} 但健康检查失败,最新日志: ==="
                docker compose logs --tail=50 app
                exit 1
              fi
              sleep 2
            done
            echo "::error::等待 60 秒后容器仍未 healthy,最新日志:"
            docker compose logs --tail=50 app
            exit 1
