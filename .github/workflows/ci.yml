name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, main]

jobs:
  ci:
    name: install · typecheck · test · build · docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 给 env.ts 的 zod 校验喂 dummy 值。
    # test 用 vi.mock 把 db 替换,不会真连 pg。
    # GOOGLE_CLIENT_ID 用 dummy,只要非空过 min(1) 校验即可。
    # 验签时 jwt.ts 还会用 jose 真实校验,但 ci 不发请求所以无所谓。
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      DATABASE_SSL: 'false'
      LOG_LEVEL: info
      NODE_ENV: test
      GOOGLE_CLIENT_ID: dummy-client-id-for-ci

    permissions:
      # GHCR push 需要 packages: write
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test --run

      - name: Build
        run: pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # GITHUB_TOKEN 默认能 push 到当前仓库所属用户的 package
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build & push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jg1848244690/xy-tab-server:latest
            ghcr.io/jg1848244690/xy-tab-server:${{ github.sha }}
          # GitHub Actions 自带层缓存,跨 workflow 复用
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        # GHCR 默认 private,设成 public 方便公开拉取(测试项目用)。
        # 只在 push 时设,PR 跑没意义。
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH /user/packages/container/xy-tab-server -f visibility=public || true

  deploy:
    name: deploy to server
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 5

    steps:
      - name: Deploy via SSH
        # appleboy/ssh-action:Secrets 加密存服务器私钥,runner 上解密用完即丢
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/tasks-api
            # fetch 到 remote-tracking 分支(避免 git 拒绝 fetch 到当前已 checkout 的分支)
            git fetch github pgsql:refs/remotes/github/pgsql --force
            git reset --hard github/pgsql
            # 拉新镜像 + 重启容器(零停机——docker compose up -d 滚动重启)
            docker compose pull
            docker compose up -d --remove-orphans
            echo '=== deploy status ==='
            docker compose ps