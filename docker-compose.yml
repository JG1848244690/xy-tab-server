# docker-compose.yml — 一把梭起 app + postgres
# 用法:
#   docker compose build           # 构建 app 镜像
#   docker compose up -d           # 后台启动
#   docker compose logs -f app     # 看日志
#   docker compose down            # 停掉服务(保留卷,数据不丢)
#   docker compose down -v         # 停掉并删卷(危险:会清掉 PG 数据)

services:
  postgres:
    # pgvector 版官方镜像:与 postgres:17 同源,多出 vector 扩展
    # (面试站 P0 的 questions.embedding / HNSW 索引依赖;CREATE EXTENSION 在迁移里)
    # 卷不变,直接换镜像重启即可,数据无迁移成本
    image: pgvector/pgvector:pg17
    # 不写 container_name,用 compose 默认命名 hlse-api-postgres-1
    # 避免跟本机/服务器上已有的其它 PG 容器撞名
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # hlsEdu 独立库,与 xy-tab-server(pgsql 分支)的 tasks 库互不影响
      POSTGRES_DB: hlse
    volumes:
      - pg-data:/var/lib/postgresql/data
    # 映射到宿主机的端口,默认 5433(避免与本机已有的 5432 实例撞端口)
    # 服务器上还跑着 tasks-api 的 PG(占 5433),用 .env 的 PG_HOST_PORT 覆盖,例如 5434
    # B5:只绑 127.0.0.1 —— 数据库口令是弱口令,以前外网可达全靠防火墙兜底;
    # 服务器上的 SSH 隧道(127.0.0.1 访问)不受影响
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hlse"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    # 镜像在 GitHub Actions CI 里 build + push 到 GHCR,服务器只 pull 不 build
    # tag 用 commit SHA(:latest 也推但生产不引用——避免漂移 / 不可回滚)
    # deploy 脚本里 IMAGE_TAG 由 `git rev-parse HEAD`(完整 40 位)注入
    # 本地 docker compose up 兜底走 :latest
    # 独立仓库名 hls-api,避免覆盖 xy-tab-server 的镜像 tag
    image: ghcr.io/jg1848244690/hls-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 9999
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 用 compose 服务名作为主机名,容器间走 docker 内置 DNS
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hlse
      DATABASE_SSL: ${DATABASE_SSL:-false}
      # 生产挂在 nginx 反代后,告诉 OpenAPI 文档给所有 path 加前缀
      # 这样 Scalar 里的 curl / Try it out 才会打到 /api-hls/questions 而非 /questions
      # 注意:只影响文档里的 servers,不影响实际路由(路由永远是根路径)
      # 服务器上走的是 kskbl.com.cn 的 /api-hls 子路径,由 .env 的 OPENAPI_BASE_PATH 覆盖
      OPENAPI_BASE_PATH: ${OPENAPI_BASE_PATH:-/api}
      # JWT 签名密钥 —— 绝不能进 git / CI log / 镜像
      # 生成:openssl rand -base64 32
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # CORS 白名单(逗号分隔,留空=不限制);注册开关(默认 true)
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      # B6:生产暴露 /doc、/reference 的开关,默认关
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      # 面试站 P0:AI 审核 agent(OpenAI 兼容)。留空 = agent 不可用(/review 返 503)
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # 防滥用:CF Turnstile(注册真人验证)。留空 = 验证关闭
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    ports:
      # 左边是宿主机端口,可通过 .env 的 PORT 覆盖
      # 必须避开 tasks-api(宿主机 9999)和前端,服务器上用 .env 的 PORT 覆盖,例如 4000
      # B5:只绑 127.0.0.1 —— 外网不再能裸连 app(以前伪造 X-Forwarded-For
      # 就能绕过登录限流);nginx 在同一台宿主机上,127.0.0.1:4000 照常可达
      - "127.0.0.1:${PORT:-9999}:9999"
    healthcheck:
      # /health 会真的 SELECT 1:PG 挂了返回 500,容器转 unhealthy(以前打 /
      # 不查库,数据库挂了容器照样 healthy)
      test: ["CMD-SHELL", "wget -qO- http://localhost:9999/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pg-data:
    name: hlse-pg-data