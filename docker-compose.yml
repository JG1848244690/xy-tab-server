# docker-compose.yml — 一把梭起 app + postgres
# 用法:
#   docker compose build           # 构建 app 镜像
#   docker compose up -d           # 后台启动
#   docker compose logs -f app     # 看日志
#   docker compose down            # 停掉服务(保留卷,数据不丢)
#   docker compose down -v         # 停掉并删卷(危险:会清掉 PG 数据)

services:
  postgres:
    image: postgres:17-alpine
    # 不写 container_name,用 compose 默认命名 hlse-api-postgres-1
    # 避免跟本机/服务器上已有的其它 PG 容器撞名
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # hlsEdu 独立库,与 xy-tab-server(pgsql 分支)的 tasks 库互不影响
      POSTGRES_DB: hlse
    volumes:
      - pg-data:/var/lib/postgresql/data
    # 本地映射到宿主机 5433,避免与本机已有的 5432 实例撞端口
    # 生产上线时可注释掉,只让容器内 app 访问
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hlse"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    # 镜像在 GitHub Actions CI 里 build + push 到 GHCR,服务器只 pull 不 build
    # tag 用 commit SHA(:latest 也推但生产不引用——避免漂移 / 不可回滚)
    # deploy 脚本里 IMAGE_TAG 由 `git rev-parse --short HEAD` 注入
    # 本地 docker compose up 兜底走 :latest
    # 独立仓库名 hls-api,避免覆盖 xy-tab-server 的镜像 tag
    image: ghcr.io/jg1848244690/hls-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 9999
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 用 compose 服务名作为主机名,容器间走 docker 内置 DNS
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hlse
      DATABASE_SSL: ${DATABASE_SSL:-false}
      # 生产挂在 nginx /api 反代后,告诉 OpenAPI 文档给所有 path 加 /api 前缀
      # 这样 Scalar 里的 curl / Try it out 才会打到 /api/questions 而非 /questions
      OPENAPI_BASE_PATH: /api
      # JWT 签名密钥 —— 绝不能进 git / CI log / 镜像
      # 生成:openssl rand -base64 32
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      # 左边是宿主机端口,可通过 .env 的 PORT 覆盖
      - "${PORT:-9999}:9999"
    healthcheck:
      # Hono 没自带 /health,沿用 / 当存活探针
      test: ["CMD-SHELL", "wget -qO- http://localhost:9999/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pg-data:
    name: hlse-pg-data